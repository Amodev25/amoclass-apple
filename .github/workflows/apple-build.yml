name: Apple build

# The point of this workflow is the macOS runner: it is the only place in the
# project where an iOS or macOS build can actually happen. Everything is
# unsigned, so it needs no Apple Developer account and no secrets.

on:
  push:
    branches: [main, master]
    paths:
      - 'amoclass_player_apple/**'
      - 'amo_platform_apple/**'
      - 'amoclass_core/**'
      - '.github/workflows/apple-build.yml'
      # The verification step runs this script, so a change to it must rebuild
      # — otherwise a fix to the check silently never runs.
      - 'scripts/**'
  pull_request:
    paths:
      - 'amoclass_player_apple/**'
      - 'amo_platform_apple/**'
      - 'amoclass_core/**'
      - '.github/workflows/apple-build.yml'
      - 'scripts/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  # Cheap gate: analyse and unit-test on Linux before paying for a macOS
  # runner, which bills at ten times the rate.
  analyze:
    name: Analyze and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: amoclass_player_apple
        run: flutter pub get
      - name: Analyze
        working-directory: amoclass_player_apple
        run: flutter analyze
      # The shared package is compiled into this app, so a break there is a
      # break here too.
      - name: Install dependencies (amoclass_core)
        working-directory: amoclass_core
        run: flutter pub get
      - name: Analyze amoclass_core
        working-directory: amoclass_core
        run: flutter analyze
      - name: Unit tests
        working-directory: amoclass_player_apple
        run: flutter test

  macos:
    name: Build macOS app
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: amoclass_player_apple
        run: flutter pub get

      # Unsigned: proves the Objective-C plugin and the C decryptor compile and
      # link. Signing needs a paid account and is deliberately not done here.
      - name: Build macOS (unsigned, debug)
        working-directory: amoclass_player_apple
        run: flutter build macos --debug

      # The Mac App Store requires the App Sandbox. Fail if it is off, both in
      # the source entitlements (Release is never built here) and in what was
      # actually signed into the debug app. The debug build is ad-hoc signed
      # ("-"), which still embeds entitlements; if a toolchain change ever
      # stops that, fall back to the DebugProfile source file rather than
      # passing silently.
      - name: Verify the App Sandbox is on
        working-directory: amoclass_player_apple
        run: |
          set -euo pipefail
          sandbox_on() { [ "$(plutil -extract com.apple.security.app-sandbox raw -o - "$1" 2>/dev/null)" = "true" ]; }

          for f in macos/Runner/Release.entitlements macos/Runner/DebugProfile.entitlements; do
            plutil -lint "$f"
            if sandbox_on "$f"; then echo "✅ $f: app-sandbox = true"; else echo "🔴 $f: app-sandbox is not true" >&2; exit 1; fi
          done

          APP=$(find build/macos/Build/Products/Debug -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          codesign -d --entitlements :- "$APP" > signed.entitlements 2>/dev/null || true
          if [ -s signed.entitlements ] && plutil -lint signed.entitlements >/dev/null 2>&1; then
            echo "──── entitlements signed into $APP ────"
            cat signed.entitlements
            if sandbox_on signed.entitlements; then
              echo "✅ signed app: app-sandbox = true"
            else
              echo "🔴 the signed app does not carry app-sandbox = true" >&2
              exit 1
            fi
          else
            echo "⚠️ no entitlements embedded in $APP (unsigned build); checked the source files only"
          fi
          rm -f signed.entitlements

      - name: Verify the native decryptor linked in
        working-directory: amoclass_player_apple
        env:
          ROOT: build/macos/Build/Products/Debug
        run: bash ../scripts/verify_native_symbols.sh "$ROOT"

      # Uploaded BEFORE the smoke test on purpose: if the app turns out not to
      # launch, the thing you need in order to debug that is the app itself.
      - name: Upload macOS app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lockclass-macos-debug-app
          path: amoclass_player_apple/build/macos/Build/Products/Debug/*.app
          retention-days: 7
          if-no-files-found: error

      # A green build proves the code compiled and linked. It does NOT prove
      # the app starts — the iOS build was green for days while every launch
      # died in dyld on an unsigned framework. This runner is a real Mac with a
      # real window server, so actually run the thing and see if it survives.
      #
      # It cannot log in (no credentials here), so this only answers the first
      # question: does the process stay alive, or does it die on launch?
      - name: Smoke test — does the macOS app launch at all?
        working-directory: amoclass_player_apple
        run: |
          set -uo pipefail

          APP=$(find build/macos/Build/Products/Debug -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "no .app was produced — nothing to smoke test" >&2
            exit 1
          fi

          # Read the executable name rather than guessing it: the bundle name
          # and the binary name are not required to match, and a product name
          # may contain a space.
          EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
          BIN="$APP/Contents/MacOS/$EXE"
          echo "launching: $BIN"
          test -x "$BIN"

          # Note what crash reports already exist, so a stale one from some
          # other process cannot be mistaken for ours.
          REPORTS="$HOME/Library/Logs/DiagnosticReports"
          mkdir -p "$REPORTS"
          BEFORE=$(ls -1 "$REPORTS" 2>/dev/null | sort || true)

          "$BIN" > launch.log 2>&1 &
          PID=$!
          sleep 25

          rc=0
          if kill -0 "$PID" 2>/dev/null; then
            echo "✅ still alive after 25s (pid $PID) — the app launches"
            kill "$PID" 2>/dev/null || true
            wait "$PID" 2>/dev/null || true
          else
            # Already gone. `wait` gives the real exit status.
            set +e; wait "$PID"; code=$?; set -e
            echo "🔴 the app exited on its own with code $code" >&2
            rc=1
          fi

          echo "──────── app output ────────"
          cat launch.log || true

          AFTER=$(ls -1 "$REPORTS" 2>/dev/null | sort || true)
          NEW=$(comm -13 <(printf '%s\n' "$BEFORE") <(printf '%s\n' "$AFTER") || true)
          if [ -n "$NEW" ]; then
            echo "──────── new crash reports ────────"
            mkdir -p crashlogs
            printf '%s\n' "$NEW" | while IFS= read -r f; do
              [ -n "$f" ] || continue
              echo "── $f"
              head -c 4000 "$REPORTS/$f"
              echo
              cp "$REPORTS/$f" crashlogs/ 2>/dev/null || true
            done
            rc=1
          fi

          exit "$rc"

      # Copied into the workspace by the step above, because upload-artifact
      # does not expand ~ and cannot reach outside the workspace.
      - name: Keep the launch log when the smoke test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lockclass-macos-launch-failure
          path: |
            amoclass_player_apple/launch.log
            amoclass_player_apple/crashlogs
          retention-days: 7
          if-no-files-found: ignore

  ios:
    name: Build iOS app
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: amoclass_player_apple
        run: flutter pub get

      # No --no-codesign here, deliberately. A simulator build needs no
      # certificate, profile or Apple account on its own, but it DOES need the
      # embedded frameworks to carry an ad-hoc signature: dyld refuses to load
      # an unsigned library even in the simulator. --no-codesign passes
      # CODE_SIGNING_ALLOWED=NO, which suppresses that local signature too, and
      # the app then dies at launch on "Trying to load an unsigned library".
      # The flag belongs on the device archive below, which a device farm
      # re-signs anyway.
      - name: Build iOS (simulator)
        working-directory: amoclass_player_apple
        run: flutter build ios --debug --simulator

      - name: Verify the native decryptor linked in
        working-directory: amoclass_player_apple
        env:
          ROOT: build/ios/iphonesimulator
        run: bash ../scripts/verify_native_symbols.sh "$ROOT"

      - name: Upload iOS app
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lockclass-ios-simulator-app
          path: amoclass_player_apple/build/ios/iphonesimulator/*.app
          retention-days: 7
          if-no-files-found: error

  # A cloud device farm (BrowserStack, LambdaTest, AWS Device Farm) needs a
  # device .ipa, not the simulator build, and re-signs it with its own
  # certificate — so an unsigned archive is enough and no Apple Developer
  # account is involved. Kept as a separate job so a packaging problem never
  # blocks the build that proves the code compiles.
  ipa:
    name: Package unsigned IPA for device farms
    needs: analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: amoclass_player_apple
        run: flutter pub get

      - name: Build for device (unsigned)
        working-directory: amoclass_player_apple
        run: flutter build ios --release --no-codesign

      # An .ipa is just a zip with the .app inside a Payload/ directory.
      # `flutter build ipa` would need an export options plist and a signing
      # identity; this does not.
      - name: Wrap the .app as an unsigned .ipa
        working-directory: amoclass_player_apple
        run: |
          set -euo pipefail
          APP=$(find build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          (cd /tmp/ipa && zip -qry "$OLDPWD/build/Lockclass-unsigned.ipa" Payload)
          ls -lh build/Lockclass-unsigned.ipa

      - name: Verify the native decryptor linked in
        working-directory: amoclass_player_apple
        run: bash ../scripts/verify_native_symbols.sh build/ios/iphoneos

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: lockclass-ios-unsigned-ipa
          path: amoclass_player_apple/build/Lockclass-unsigned.ipa
          retention-days: 7
          if-no-files-found: error
